worker_processes 1;
pid /tmp/apigate-nginx-tls-off/nginx.pid;
error_log /tmp/apigate-nginx-tls-off/error.log notice;

events {
  worker_connections 128;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /tmp/apigate-nginx-tls-off/access.log;
  client_body_temp_path /tmp/apigate-nginx-tls-off/client_body;
  proxy_temp_path /tmp/apigate-nginx-tls-off/proxy;

  server {
    listen 127.0.0.1:13028 ssl;
    server_name ecodata.odb.ntu.edu.tw;

    ssl_certificate /tmp/apigate-nginx-tls-off/cert.pem;
    ssl_certificate_key /tmp/apigate-nginx-tls-off/key.pem;

    location ^~ /api {
      proxy_pass http://127.0.0.1:13029;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 900;
    }
  }
}
